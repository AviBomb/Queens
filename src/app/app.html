<div class="app-shell">
  <app-header
    (openHowToPlay)="showHowToPlay.set(true)"
    (openStats)="showStats.set(true)"
  />

  <main class="game-layout">
    <app-board />
    <app-toolbar />
  </main>

  <footer class="app-footer">
    <p class="footer-note">
      <app-icon name="offline" />
      Works offline. New daily puzzle at midnight.
    </p>
    <nav class="footer-links" aria-label="Help and statistics">
      <button type="button" class="footer-link" (click)="showHowToPlay.set(true)">How to play</button>
      <button type="button" class="footer-link" (click)="showStats.set(true)">Statistics</button>
    </nav>
  </footer>

  @if (game.isSolved() && showVictory()) {
    <app-victory-modal (close)="showVictory.set(false)" />
  }

  @if (showHowToPlay()) {
    <app-how-to-play-modal (close)="showHowToPlay.set(false)" />
  }

  @if (showStats()) {
    <app-stats-modal (close)="showStats.set(false)" />
  }
</div>
